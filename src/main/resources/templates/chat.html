<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chat with ' + ${otherUser.name} + ' - Kite Images'">Chat - Kite Images</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <aside class="sidebar">
        <a href="/home" class="sidebar-logo">
            <img src="/images/kite-logo3.svg" class="sidebar-logo-img" alt="Kite">
        </a>
        <a href="/home" class="sidebar-icon" title="Home">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg>
        </a>
        <a href="/my-uploads" class="sidebar-icon" title="My Uploads">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </a>
        <a href="/saved" class="sidebar-icon" title="Saved">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="/notifications" class="sidebar-icon notif-icon" title="Notifications">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-count" id="notif-badge"></span>
        </a>
        <a href="/connect" class="sidebar-icon" title="Connect">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </a>
        <a href="/messages" class="sidebar-icon active" title="Messages">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </a>
        <a href="/create" class="sidebar-icon" title="Create">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </a>
        <a href="/profile" class="sidebar-icon" title="Profile">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </a>
    </aside>

    <div class="main-wrapper">
        <header class="navbar">
            <a th:href="@{'/messages'}" class="logo">
                <span class="back-arrow">←</span>
                <span>Messages</span>
            </a>
            <div class="nav-right">
                <a th:href="@{'/user/' + ${otherUser.id}}" class="chat-user-name" th:text="${otherUser.name}">User</a>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div th:each="msg : ${messages}" class="chat-message"
                     th:classappend="${msg.sender.id == user.id} ? 'sent' : 'received'">
                    <div class="chat-bubble" th:text="${msg.text}">Message</div>
                    <button th:if="${msg.sender.id == user.id}"
                            class="chat-delete-btn"
                            th:data-msg-id="${msg.id}"
                            onclick="deleteMessage(this)"
                            title="Delete message">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>

            <form class="chat-input-form" onsubmit="sendMessage(event)">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." maxlength="500" required>
                <button type="submit" class="chat-send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const otherUserId = /*[[${otherUser.id}]]*/ 1;
        const currentUserId = /*[[${user.id}]]*/ 1;

        const chatMessages = document.getElementById('chatMessages');
        chatMessages.scrollTop = chatMessages.scrollHeight;

        function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const formData = new FormData();
            formData.append('text', text);

            fetch('/messages/' + otherUserId + '/send', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) return;

                const div = document.createElement('div');
                div.className = 'chat-message sent';
                div.innerHTML =
                    '<div class="chat-bubble">' + data.text + '</div>' +
                    '<button class="chat-delete-btn" data-msg-id="' + data.messageId + '" onclick="deleteMessage(this)" title="Delete message">' +
                    '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' +
                    '</button>';
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                input.value = '';
            });
        }

        function deleteMessage(btn) {
            const msgId = btn.getAttribute('data-msg-id');

            fetch('/messages/delete/' + msgId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    btn.parentElement.remove();
                }
            });
        }
    </script>

    <script>
        fetch('/api/notifications/unread-count?t=' + Date.now())
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var badge = document.getElementById('notif-badge');
                if (badge && data.count > 0) {
                    badge.textContent = data.count > 9 ? '9+' : data.count;
                    badge.style.display = 'flex';
                }
            });
    </script>

</body>

</html>
