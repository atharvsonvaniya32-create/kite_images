<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pin.title} + ' - Kite Images'">Pin - Kite Images</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <a href="/home" class="sidebar-logo">
            <img src="/images/kite-logo3.svg" class="sidebar-logo-img" alt="Kite">
        </a>

        <a href="/home" class="sidebar-icon" title="Home">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/>
            </svg>
        </a>

        <a href="/my-uploads" class="sidebar-icon" title="My Uploads">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
            </svg>
        </a>

        <a href="/saved" class="sidebar-icon" title="Saved">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
        </a>

        <a href="/notifications" class="sidebar-icon notif-icon" title="Notifications">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-count" id="notif-badge"></span>
        </a>

        <a href="/connect" class="sidebar-icon" title="Connect">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </a>

        <a href="/messages" class="sidebar-icon" title="Messages">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </a>

        <a href="/create" class="sidebar-icon" title="Create">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
        </a>

        <a href="/profile" class="sidebar-icon" title="Profile">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
            </svg>
        </a>

    </aside>

    <!-- MAIN CONTENT -->
    <div class="pin-detail-wrapper">

        <!-- PIN DETAIL CARD -->
        <div class="pin-detail-card">

            <!-- LEFT: IMAGE -->
            <div class="pin-detail-image">
                <img th:src="@{'/pins/image/' + ${pin.id}}" th:alt="${pin.title}">
            </div>

            <!-- RIGHT: INFO -->
            <div class="pin-detail-info">

                <!-- ACTION BAR -->
                <div class="pin-detail-actions">
                    <div class="pin-detail-actions-left">
                        <!-- LIKE -->
                        <button class="pin-action-btn like-btn"
                                th:data-pin-id="${pin.id}"
                                th:data-liked="${liked}"
                                onclick="toggleLike(this)">
                            <svg th:if="${!liked}" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <svg th:if="${liked}" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                            <span class="like-count" th:text="${pin.likeCount}">0</span>
                        </button>

                        <!-- COMMENT COUNT -->
                        <button class="pin-action-btn" onclick="document.querySelector('.comment-input').focus()">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                        </button>

                        <!-- SHARE -->
                        <button class="pin-action-btn">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                                <polyline points="16 6 12 2 8 6"/>
                                <line x1="12" y1="2" x2="12" y2="15"/>
                            </svg>
                        </button>

                        <!-- MORE -->
                        <button class="pin-action-btn">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <circle cx="12" cy="5" r="2"/>
                                <circle cx="12" cy="12" r="2"/>
                                <circle cx="12" cy="19" r="2"/>
                            </svg>
                        </button>
                    </div>

                    <div class="pin-detail-actions-right">
                        <!-- SAVE BUTTON -->
                        <button class="pin-save-btn"
                                th:data-pin-id="${pin.id}"
                                th:data-saved="${saved}"
                                onclick="toggleSave(this)">
                            <span th:text="${saved} ? 'Saved' : 'Save'">Save</span>
                        </button>
                    </div>
                </div>

                <!-- PIN TITLE & CATEGORY -->
                <div class="pin-detail-title-section">
                    <h1 class="pin-detail-title" th:text="${pin.title}">Pin Title</h1>
                    <span class="pin-detail-category" th:text="${pin.category}">Category</span>
                </div>

                <!-- USER INFO -->
                <div class="pin-detail-user" th:if="${pin.user != null}">
                    <div class="pin-detail-user-avatar">
                        <img th:if="${pin.user.profilePicture != null}"
                             th:src="@{'/profile/image/' + ${pin.user.id}}" alt="User">
                        <div th:if="${pin.user.profilePicture == null}" class="profile-picture small">
                            <span th:text="${pin.user.name.substring(0,1)}">U</span>
                        </div>
                    </div>
                    <span class="pin-detail-user-name" th:text="${pin.user.name}">User Name</span>
                </div>

                <!-- COMMENTS SECTION -->
                <div class="pin-detail-comments">
                    <div class="comments-header">
                        <span class="comments-count" th:text="${pin.commentCount} + ' Comments'">0 Comments</span>
                    </div>

                    <!-- COMMENT LIST -->
                    <div class="comment-list">
                        <div class="comment-item" th:each="comment : ${comments}">
                            <div class="comment-avatar">
                                <img th:if="${comment.user.profilePicture != null}"
                                     th:src="@{'/profile/image/' + ${comment.user.id}}" alt="User">
                                <div th:if="${comment.user.profilePicture == null}" class="profile-picture small">
                                    <span th:text="${comment.user.name.substring(0,1)}">U</span>
                                </div>
                            </div>
                            <div class="comment-body">
                                <span class="comment-author" th:text="${comment.user.name}">User</span>
                                <span class="comment-text" th:text="${comment.text}">Comment</span>
                            </div>
                        </div>

                        <div class="no-comments" th:if="${#lists.isEmpty(comments)}">
                            No comments yet. Add one!
                        </div>
                    </div>
                </div>

                <!-- COMMENT INPUT -->
                <div class="pin-detail-comment-input">
                    <form onsubmit="addComment(event)" class="comment-form">
                        <input type="text"
                               class="comment-input"
                               placeholder="Add a comment"
                               maxlength="500"
                               required>
                        <button type="submit" class="comment-submit" title="Post comment">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </form>
                </div>

            </div>
        </div>

        <!-- RELATED PINS -->
        <div class="related-pins">
            <h2 class="related-title">More like this</h2>
            <div class="related-grid">
                <a th:each="rpin : ${relatedPins}"
                   th:if="${rpin.id != pin.id}"
                   th:href="@{'/pin/' + ${rpin.id}}"
                   class="related-pin-card">
                    <img th:src="@{'/pins/image/' + ${rpin.id}}" th:alt="${rpin.title}">
                </a>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script th:inline="javascript">
        const pinId = /*[[${pin.id}]]*/ 1;

        function toggleLike(btn) {
            fetch('/pin/' + pinId + '/like', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            })
            .then(res => res.json())
            .then(data => {
                const countEl = btn.querySelector('.like-count');
                countEl.textContent = data.likeCount;

                if (data.liked) {
                    btn.setAttribute('data-liked', 'true');
                    btn.querySelector('svg').setAttribute('fill', 'currentColor');
                } else {
                    btn.setAttribute('data-liked', 'false');
                    btn.querySelector('svg').setAttribute('fill', 'none');
                }
            });
        }

        function toggleSave(btn) {
            fetch('/pin/' + pinId + '/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            })
            .then(res => res.json())
            .then(data => {
                const span = btn.querySelector('span');
                if (data.saved) {
                    btn.setAttribute('data-saved', 'true');
                    btn.classList.add('saved-active');
                    span.textContent = 'Saved';
                } else {
                    btn.setAttribute('data-saved', 'false');
                    btn.classList.remove('saved-active');
                    span.textContent = 'Save';
                }
            });
        }

        function addComment(event) {
            event.preventDefault();

            const input = document.querySelector('.comment-input');
            const text = input.value.trim();

            if (!text) return;

            const formData = new FormData();
            formData.append('text', text);

            fetch('/pin/' + pinId + '/comment', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }

                const commentList = document.querySelector('.comment-list');
                const noComments = commentList.querySelector('.no-comments');
                if (noComments) noComments.remove();

                const initials = data.userName.substring(0, 1).toUpperCase();

                const commentHtml = `
                    <div class="comment-item">
                        <div class="comment-avatar">
                            <div class="profile-picture small">
                                <span>${initials}</span>
                            </div>
                        </div>
                        <div class="comment-body">
                            <span class="comment-author">${data.userName}</span>
                            <span class="comment-text">${data.commentText}</span>
                        </div>
                    </div>
                `;

                commentList.insertAdjacentHTML('afterbegin', commentHtml);

                document.querySelector('.comments-count').textContent = data.commentCount + ' Comments';

                input.value = '';
            });
        }
    </script>

    <script>
        fetch('/api/notifications/unread-count?t=' + Date.now())
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var badge = document.getElementById('notif-badge');
                if (badge && data.count > 0) {
                    badge.textContent = data.count > 9 ? '9+' : data.count;
                    badge.style.display = 'flex';
                }
            });
    </script>

</body>
</html>
