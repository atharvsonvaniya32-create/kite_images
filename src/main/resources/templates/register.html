<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kite Images - Create Account</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body class="auth-body">


<div class="auth-container">


    <!-- BRAND -->

    <div class="auth-brand">

        <div class="kite-logo">
            K
        </div>

        <h1>Kite Images</h1>

        <p>
            Your place for<br>
            inspiration and ideas.
        </p>

    </div>


    <!-- REGISTER -->

    <div class="auth-card">

        <h2>Create account</h2>

        <p class="auth-subtitle">
            Join Kite Images today
        </p>


        <form
                th:action="@{/register}"
                method="post"
                enctype="multipart/form-data"
                th:object="${user}">


            <label>Name</label>

            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="Your name"
                    required>


            <label>Email</label>

            <input
                    type="email"
                    th:field="*{email}"
                    placeholder="Your email"
                    required>


            <label>Password</label>

            <input
                    type="password"
                    th:field="*{password}"
                    placeholder="Create a password"
                    required>


            <label>Profile picture</label>

            <input
                    type="file"
                    name="profilePicture"
                    accept="image/*">


            <button
                    class="auth-button"
                    type="submit">

                Create account

            </button>


        </form>


        <p class="register-text">

            Already have an account?

            <a href="/">
                Log in
            </a>

        </p>

    </div>

</div>


</body>

</html>
