spring.application.name=kite_images

# Local dev uses the gitignored application-local.properties (activated by
# spring.profiles.default below). In production that file is absent from the
# image, so DB_PASSWORD is used instead.
spring.profiles.default=local

server.port=${PORT:1717}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql-ef3a8f5-atharvsonvaniya32-44b0.d.aivencloud.com:28214/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.web=DEBUG